
services:
  # PaddleOCR-VL-1.6-0.9B: the RECOGNITION model. It reads the crops our detector cuts — one request per region, with
  # the task prompt chosen by what the region is (OCR / Table / Formula / Chart / Seal). It does NOT do layout: that is
  # a detector (PP-DocLayoutV3) running in the worker's own pool, which is the whole reason for the switch.
  # Served by stock vLLM — the architecture is registered upstream, so it needs no vendor image and inherits every
  # Blackwell fix we already rely on for qwen. bf16, not fp8: at 0.9B the weights are only 1.8GB and quality is the
  # point. Tables come back as OTSL (one token per cell), so a dense table costs a fraction of what styled HTML would.
  paddleocr:
    image: vllm/vllm-openai:latest
    container_name: citadel-paddleocr
    restart: always
    ipc: host
    command:
      - --model
      - PaddlePaddle/PaddleOCR-VL-1.6
      - --served-model-name
      - paddleocr-vl
      - --host
      - 0.0.0.0
      - --port
      - "${CITADEL_PADDLEOCR_PORT:-8099}"
      - --gpu-memory-utilization
      - "0.30"
      # must EQUAL the crop semaphore: below it the GPU cannot fill its sequence slots, above it the excess merely
      # queues INSIDE the model, where every waiting request pins a decoded image. vLLM also pre-allocates HOST memory
      # for multimodal staging in proportion to this, worse than linearly.
      - --max-num-seqs
      - "128"
      # NOT the model default of 131072, which leaves a KV cache that holds barely two full-length sequences. A crop is
      # a region of one page: its prompt is ~1.3k image tokens and its answer is at most a dense table.
      - --max-model-len
      - "8192"
      - --kv-cache-dtype
      - fp8
      # every image we send is unique — one crop per region, nothing repeats — so a cache keyed on the image cannot hit.
      # it lives in HOST RAM, which is the scarce resource here.
      - --mm-processor-cache-gb
      - "0"
      # already the default; pinned so a future default cannot silently un-overlap the CPU scheduler from GPU execution.
      # NOT set: --api-server-count. It measured no throughput at all and it DISABLES vLLM's stats logging — the
      # Running/Waiting lines are the only window we have into whether we are feeding the model, and that log is what
      # caught a socket pool silently capping us at half the GPU. Do not trade it for nothing.
      - --async-scheduling
      # info, not warning: at warning the server logs NOTHING about a request it drops, which is why the disconnects
      # could only be guessed at. the access log says whether a failing request ever reached uvicorn — if it did, the
      # server chose to drop it and will say why; if it did not, it died in the socket layer beneath. those are
      # different bugs and nothing else distinguishes them.
      - --uvicorn-log-level
      - info
    ports:
      - "${CITADEL_PADDLEOCR_PORT:-8099}:${CITADEL_PADDLEOCR_PORT:-8099}"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # HF weights on a HOST dir so `compose down -v` never wipes the download; torch.compile cache in a named volume.
      - ${HOME}/.cache/citadel-paddleocr:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Qwen3.5-4B (Gated DeltaNet hybrid) served by vLLM with strict guided decoding (xgrammar) so structured
  # output (table structure, filters) is grammar-enforced, not best-effort. fp8 online-quantized; multimodal
  # model served text-only (no images sent). gpu-mem 0.30 co-locates with the recognition model (0.30) + the BGE-M3 embedder.
  qwen:
    image: vllm/vllm-openai:latest
    container_name: citadel-qwen
    restart: always
    ipc: host
    command:
      - --model
      - Qwen/Qwen3.5-4B
      - --served-model-name
      - qwen
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --quantization
      - fp8
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "0.30"
      - --max-num-seqs
      - "32"
      - --max-model-len
      - "32768"
      - --enforce-eager
      - --enable-prefix-caching
      - --language-model-only
      - --uvicorn-log-level
      - warning
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8100:8100"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # HF model cache on a HOST dir (bind mount) so `docker compose down -v` never wipes the ~8GB download.
      - ${HOME}/.cache/citadel-qwen:/root/.cache/huggingface
      - qwen-vllm-cache:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    restart: always
    ports:
      - "${CITADEL_REDIS_PORT:-6379}:6379"
    # Ephemeral ingestion bus — NO persistence. Redis carries transient streams + multi-MB page images;
    # the DB is the source of truth and run.sh FLUSHALLs each run. AOF/RDB here only fork- and fsync-stall
    # the single-threaded server under image load → those freezes time out client connects and crash the
    # worker. Keep it purely in-memory (no --save, no appendonly).
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

  postgres:
    image: pgvector/pgvector:pg17
    container_name: citadel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${CITADEL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CITADEL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITADEL_POSTGRES_DB:-citadel}
    # app pool (50) + worker pool (50) + listener + migrations must fit; default 100 is too tight, so lift the ceiling
    command:
      - postgres
      - -c
      - max_connections=200
      # reap a backend whose client vanished (hard-killed app) even mid-statement, so its locks don't strand the next
      # run: send keepalives after 30s idle, retry every 10s x3 → dead peer detected and rolled back within ~60s.
      - -c
      - tcp_keepalives_idle=30
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
    ports:
      - "${CITADEL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # runs on first DB init (empty data dir) → creates the pgvector extension; persists in the volume across restarts
      - ./scripts/db:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
  vllm-cache:
  qwen-vllm-cache:
