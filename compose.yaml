
services:
  # MinerU2.5-Pro raw VLM server (OpenAI-compatible). Driven per-page by our workers via
  # mineru-vl-utils http-client (two_step_extract) — NOT the capped-at-3 mineru-api REST path.
  # Only `--engine` is mineru-openai-server's own flag; --host/--port/--gpu-memory-utilization/
  # --max-num-seqs are forwarded to vLLM. gpu-mem 0.5 reserves ~half the 24GB (mobile 5090) for the
  # co-located BGE-M3 bi-encoder + the local query/generation SLM (text, ~32k ctx for batching).
  # `mineru:latest` is built from MinerU's Dockerfile (model baked in, MINERU_MODEL_SOURCE=local).
  mineru:
    image: mineru:latest
    container_name: citadel-mineru
    restart: always
    ipc: host
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-openai-server
    command:
      - --engine
      - vllm
      - --host
      - 0.0.0.0
      - --port
      - "${CITADEL_MINERU_PORT:-8099}"
      - --gpu-memory-utilization
      - "0.35"
      - --max-num-seqs
      - "128"
      - --quantization
      - fp8
      - --kv-cache-dtype
      - fp8
      # MM processor cache: enabled but capped (it lives in HOST RAM). a real win on repeated/templated pages
      # (forms, letterheads) + within-page re-encodes; bounded to 2GB so it can't balloon the host footprint.
      # cache only affects speed, never the output — so it doesn't touch the OmniDocBench quality numbers.
      - --mm-processor-cache-gb
      - "2"
      - --uvicorn-log-level
      - warning
    ports:
      - "${CITADEL_MINERU_PORT:-8099}:${CITADEL_MINERU_PORT:-8099}"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # Models are baked into the image at build time (mineru-models-download). Do NOT mount the
      # host HF cache here — it shadows the baked-in model. Persist the torch.compile cache in a
      # NAMED volume (docker-managed) so the root container never creates root-owned files on the host.
      - vllm-cache:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Qwen3.5-4B (Gated DeltaNet hybrid) served by vLLM with strict guided decoding (xgrammar) so structured
  # output (table structure, filters) is grammar-enforced, not best-effort. fp8 online-quantized; multimodal
  # model served text-only (no images sent). gpu-mem 0.25 co-locates with mineru (0.5) + the BGE-M3 embedder.
  qwen:
    image: vllm/vllm-openai:latest
    container_name: citadel-qwen
    restart: always
    ipc: host
    command:
      - --model
      - Qwen/Qwen3.5-4B
      - --served-model-name
      - qwen
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --quantization
      - fp8
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "0.30"
      - --max-num-seqs
      - "32"
      - --max-model-len
      - "32768"
      - --enforce-eager
      - --enable-prefix-caching
      - --language-model-only
      - --uvicorn-log-level
      - warning
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8100:8100"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # HF model cache on a HOST dir (bind mount) so `docker compose down -v` never wipes the ~8GB download.
      - ${HOME}/.cache/citadel-qwen:/root/.cache/huggingface
      - qwen-vllm-cache:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    restart: always
    ports:
      - "${CITADEL_REDIS_PORT:-6379}:6379"
    # Ephemeral ingestion bus — NO persistence. Redis carries transient streams + multi-MB page images;
    # the DB is the source of truth and run.sh FLUSHALLs each run. AOF/RDB here only fork- and fsync-stall
    # the single-threaded server under image load → those freezes time out client connects and crash the
    # worker. Keep it purely in-memory (no --save, no appendonly).
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

  postgres:
    image: pgvector/pgvector:pg17
    container_name: citadel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${CITADEL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CITADEL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITADEL_POSTGRES_DB:-citadel}
    ports:
      - "${CITADEL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # runs on first DB init (empty data dir) → creates the pgvector extension; persists in the volume across restarts
      - ./scripts/db:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
  vllm-cache:
  qwen-vllm-cache:
