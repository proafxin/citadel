
services:
  # MinerU2.5-Pro raw VLM server (OpenAI-compatible). Driven per-page by our workers via
  # mineru-vl-utils http-client (two_step_extract) — NOT the capped-at-3 mineru-api REST path.
  # Only `--engine` is mineru-openai-server's own flag; --host/--port/--gpu-memory-utilization/
  # --max-num-seqs are forwarded to vLLM. gpu-mem 0.5 reserves ~half the 24GB (mobile 5090) for the
  # co-located BGE-M3 bi-encoder + the local query/generation SLM (text, ~32k ctx for batching).
  # `mineru:latest` is built from MinerU's Dockerfile (model baked in, MINERU_MODEL_SOURCE=local).
  mineru:
    image: mineru:latest
    container_name: citadel-mineru
    restart: always
    ipc: host
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-openai-server
    command:
      - --engine
      - vllm
      - --host
      - 0.0.0.0
      - --port
      - "${CITADEL_MINERU_PORT:-8099}"
      - --gpu-memory-utilization
      - "0.5"
      - --max-num-seqs
      - "128"
      - --quantization
      - fp8
      # MM processor cache: enabled but capped (it lives in HOST RAM). a real win on repeated/templated pages
      # (forms, letterheads) + within-page re-encodes; bounded to 2GB so it can't balloon the host footprint.
      # cache only affects speed, never the output — so it doesn't touch the OmniDocBench quality numbers.
      - --mm-processor-cache-gb
      - "2"
      - --uvicorn-log-level
      - warning
    ports:
      - "${CITADEL_MINERU_PORT:-8099}:${CITADEL_MINERU_PORT:-8099}"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # Models are baked into the image at build time (mineru-models-download). Do NOT mount the
      # host HF cache here — it shadows the baked-in model. Persist only the torch.compile cache.
      - ~/.cache/vllm:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Qwen3-8B (TEXT-NATIVE) via vLLM (OpenAI-compatible) for the local SLM tasks: bounded heading-level assignment
  # (per-doc heading list only), tabular structure/anchors, evidence filtering, chat/report generation.
  # NOTE: Qwen3.5-9B was DROPPED — it is multimodal and vLLM 0.23 won't unload its vision tower even with
  # --language-model-only (model stayed ~10.3GB), so it couldn't co-fit with MinerU. Qwen3-8B has NO vision tower.
  # Co-located with MinerU → gpu-mem utils sum ≤ ~0.9 (mineru 0.5 + this 0.35), leaving ~3.6GB for BGE-M3.
  # CITADEL_QWEN_MODEL default = Qwen/Qwen3-8B-AWQ (~5.5GB). vLLM auto-detects the quant from the repo config.
  # NO fp8 KV-cache: on Blackwell sm_120 fp8-KV forces the FlashInfer attention backend whose kernels HANG at init;
  # dropping it lets vLLM use TRITON_ATTN (the sm_120 default). KV is fp16 → max-model-len capped at 16384 to fit.
  qwen:
    image: vllm/vllm-openai:latest
    container_name: citadel-qwen
    profiles: ["vllm"]  # DISABLED by default — vLLM hangs on Blackwell sm_120 (FlashInfer); SLM runs via host ollama.
    restart: always
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${CITADEL_QWEN_MODEL:-Qwen/Qwen3-8B-AWQ}
      - --served-model-name
      - qwen
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.35"
      - --max-model-len
      - "16384"
      - --enforce-eager
      - --uvicorn-log-level
      - warning
    ports:
      - "${CITADEL_QWEN_PORT:-8199}:8000"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      # persist torch.compile / CUDA-graph cache so restarts skip recompilation (the slow part of startup)
      - ~/.cache/vllm:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    restart: always
    ports:
      - "${CITADEL_REDIS_PORT:-6379}:6379"
    # Append-only persistence so Redis Streams (worker queues / pub-sub) survive restarts
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  postgres:
    image: pgvector/pgvector:pg17
    container_name: citadel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${CITADEL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CITADEL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITADEL_POSTGRES_DB:-citadel}
    ports:
      - "${CITADEL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # runs on first DB init (empty data dir) → creates the pgvector extension; persists in the volume across restarts
      - ./scripts/db:/docker-entrypoint-initdb.d:ro

volumes:
  redis-data:
  postgres-data:
