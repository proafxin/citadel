
services:
  # MinerU2.5-Pro raw VLM server (OpenAI-compatible). Driven per-page by our workers via
  # mineru-vl-utils http-client (two_step_extract) — NOT the capped-at-3 mineru-api REST path.
  # Only `--engine` is mineru-openai-server's own flag; --host/--port/--gpu-memory-utilization/
  # --max-num-seqs are forwarded to vLLM. gpu-mem 0.6 leaves ~9.5GB for co-located embedders.
  # `mineru:latest` is built from MinerU's Dockerfile (model baked in, MINERU_MODEL_SOURCE=local).
  mineru:
    image: mineru:latest
    container_name: citadel-mineru
    restart: always
    ipc: host
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-openai-server
    command:
      - --engine
      - vllm
      - --host
      - 0.0.0.0
      - --port
      - "${CITADEL_MINERU_PORT:-8099}"
      - --gpu-memory-utilization
      - "0.6"
      - --max-num-seqs
      - "256"
      - --quantization
      - fp8
      # MM processor cache left at vLLM's default (enabled): a real win on repeated/templated pages
      # (forms, letterheads) and within-page re-encodes. It was only zeroed back when we ran stock MinerU
      # ourselves and needed a cold-vs-cold compare; quality is now scored against MinerU's published numbers,
      # so there's no fairness reason to disable it (the cache changes speed, never the output).
      - --uvicorn-log-level
      - warning
    ports:
      - "${CITADEL_MINERU_PORT:-8099}:${CITADEL_MINERU_PORT:-8099}"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # Models are baked into the image at build time (mineru-models-download). Do NOT mount the
      # host HF cache here — it shadows the baked-in model. Persist only the torch.compile cache.
      - ~/.cache/vllm:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    restart: always
    ports:
      - "${CITADEL_REDIS_PORT:-6379}:6379"
    # Append-only persistence so Redis Streams (worker queues / pub-sub) survive restarts
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  redis-data:
