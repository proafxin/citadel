
services:
  # MinerU2.5-Pro raw VLM server (OpenAI-compatible). Driven per-page by our workers via
  # mineru-vl-utils http-client (two_step_extract) — NOT the capped-at-3 mineru-api REST path.
  # Only `--engine` is mineru-openai-server's own flag; --host/--port/--gpu-memory-utilization/
  # --max-num-seqs are forwarded to vLLM. gpu-mem 0.9 = full GPU for the VLM (no co-located query LLM
  # running yet; dial back to ~0.6 once the retrieval/query LLM shares this GPU).
  # `mineru:latest` is built from MinerU's Dockerfile (model baked in, MINERU_MODEL_SOURCE=local).
  mineru:
    image: mineru:latest
    container_name: citadel-mineru
    restart: always
    ipc: host
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-openai-server
    command:
      - --engine
      - vllm
      - --host
      - 0.0.0.0
      - --port
      - "${CITADEL_MINERU_PORT:-8099}"
      - --gpu-memory-utilization
      - "0.9"
      - --max-num-seqs
      - "256"
      - --quantization
      - fp8
      # MM processor cache: enabled but capped (it lives in HOST RAM). a real win on repeated/templated pages
      # (forms, letterheads) + within-page re-encodes; bounded to 2GB so it can't balloon the host footprint.
      # cache only affects speed, never the output — so it doesn't touch the OmniDocBench quality numbers.
      - --mm-processor-cache-gb
      - "2"
      - --uvicorn-log-level
      - warning
    ports:
      - "${CITADEL_MINERU_PORT:-8099}:${CITADEL_MINERU_PORT:-8099}"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # Models are baked into the image at build time (mineru-models-download). Do NOT mount the
      # host HF cache here — it shadows the baked-in model. Persist only the torch.compile cache.
      - ~/.cache/vllm:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    restart: always
    ports:
      - "${CITADEL_REDIS_PORT:-6379}:6379"
    # Append-only persistence so Redis Streams (worker queues / pub-sub) survive restarts
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17-alpine
    container_name: citadel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${CITADEL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CITADEL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITADEL_POSTGRES_DB:-citadel}
    ports:
      - "${CITADEL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
