
services:
  lm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: lm
    restart: always
    ipc: host
    command:
      - --model
      - /models/Qwen3.8-27B-UD-IQ3_XXS.gguf
      - --mmproj
      - /models/mmproj-Qwen3.8-27B-BF16.gguf
      - --chat-template-file
      - /models/chat_template.jinja
      - --image-min-tokens
      - "1024"
      - -ngl
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --ctx-size
      - "131072"
      - --parallel
      - "4"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "2"
      - --metrics
      - --cache-type-k
      - f16
      - --cache-type-v
      - f16
      - --flash-attn
      - "on"
      - --alias
      - lm
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/v1/models"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./data/gguf_models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

