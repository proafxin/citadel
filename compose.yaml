
services:
  qwen:
    image: vllm/vllm-openai:latest
    container_name: citadel-qwen
    restart: always
    ipc: host
    command:
      - --model
      - Qwen/Qwen3-VL-8B-Instruct
      - --served-model-name
      - qwen
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --kv-cache-dtype
      - auto
      - --gpu-memory-utilization
      - "0.98"
      - --max-model-len
      - "22000"
      - --mm-processor-cache-gb
      - "0"
      - --max-num-seqs
      - "32"
      - --uvicorn-log-level
      - info
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    ports:
      - "8100:8100"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ${HOME}/.cache/citadel-qwen:/root/.cache/huggingface
      - qwen-vllm-cache:/root/.cache/vllm
      - ./data/gguf_models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

