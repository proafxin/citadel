
services:
  # MinerU2.5-Pro document-parsing API (replaces the Qwen3.5 vLLM server).
  # mineru-api = full pipeline behind REST: POST a file, get markdown + JSON-with-bboxes.
  # The `mineru:latest` image is built once from MinerU's Dockerfile (docker/ in their repo);
  # the build bundles the correct vLLM version, mineru-vl-utils, and the MinerU2.5-Pro model
  # (MINERU_MODEL_SOURCE=local). It is NOT a public registry tag — see the build note.
  mineru:
    image: mineru:latest
    container_name: citadel-mineru
    restart: always
    ipc: host
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-api
    command:
      - --host
      - 0.0.0.0
      - --port
      - "${CITADEL_MINERU_PORT:-8099}"
      # vLLM KV-cache budget (passthrough to the engine). 0.9 maximizes KV cache → concurrency
      # headroom on the 24GB card; the 1.2B weights are only ~2.4GB.
      - --gpu-memory-utilization
      - "0.9"
      # forwarded to vLLM: let continuous batching admit many windowed pages at once
      # (KV cache at 0.9 has ample room on the 1.2B model; vLLM only admits what fits)
      - --max-num-seqs
      - "128"
      # preload the VLM at startup so the first request doesn't eat the cold-start
      - --enable-vlm-preload
      - "True"
    ports:
      - "${CITADEL_MINERU_PORT:-8099}:${CITADEL_MINERU_PORT:-8099}"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # Models are baked into the image at build time (mineru-models-download). Do NOT mount the
      # host HF cache here — it shadows the baked-in model. Persist only the torch.compile cache.
      - ~/.cache/vllm:/root/.cache/vllm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CITADEL_MINERU_PORT:-8099}/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    restart: always
    ports:
      - "${CITADEL_REDIS_PORT:-6379}:6379"
    # Append-only persistence so Redis Streams (worker queues / pub-sub) survive restarts
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  redis-data:
