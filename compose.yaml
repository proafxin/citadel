
services:
  qwen:
    image: vllm/vllm-openai:v0.26.0
    container_name: citadel-qwen
    restart: always
    ipc: host
    command:
      - --model
      - Qwen/Qwen3.5-9B
      - --served-model-name
      - qwen
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --quantization
      - fp8
      - --kv-cache-dtype
      - auto
      - --gpu-memory-utilization
      - "0.88"
      - --max-num-seqs
      - "160"
      - --max-model-len
      - "65536"
      - --mm-processor-cache-gb
      - "0"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --chat-template
      - /etc/citadel/qwen-no-think.jinja
      - --uvicorn-log-level
      - info
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8100:8100"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ${HOME}/.cache/citadel-qwen:/root/.cache/huggingface
      - qwen-vllm-cache:/root/.cache/vllm
      - ./scripts/qwen-no-think.jinja:/etc/citadel/qwen-no-think.jinja:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  bge:
    image: vllm/vllm-openai:v0.26.0
    container_name: citadel-bge
    restart: always
    ipc: host
    command:
      - --model
      - BAAI/bge-m3
      - --served-model-name
      - bge
      - --host
      - 0.0.0.0
      - --port
      - "8101"
      - --hf-overrides
      - '{"architectures": ["BgeM3EmbeddingModel"]}'
      - --pooler-config
      - '{"task": "embed", "pooling_type": "CLS"}'
      - --gpu-memory-utilization
      - "0.12"
      - --max-num-seqs
      - "512"
      - --max-model-len
      - "8192"
      - --uvicorn-log-level
      - info
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8101:8101"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ${HOME}/.cache/citadel-bge:/root/.cache/huggingface
      - bge-vllm-cache:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    restart: always
    ports:
      - "${CITADEL_REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

  postgres:
    image: pgvector/pgvector:pg17
    container_name: citadel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${CITADEL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CITADEL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITADEL_POSTGRES_DB:-citadel}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - tcp_keepalives_idle=30
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
    ports:
      - "${CITADEL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
  qwen-vllm-cache:
  bge-vllm-cache:
