
services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: citadel-qwen
    restart: always
    ipc: host
    command:
      - --model
      - /models/Qwen3.8-27B-Q4_K_M.gguf
      - --mmproj
      - /models/mmproj-Qwen3.8-27B-bf16.gguf
      - -ngl
      - "999"
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --ctx-size
      - "65536"
      - --parallel
      - "4"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --alias
      - qwen
      - --chat-template-kwargs
      - '{"enable_thinking": false}'
    ports:
      - "8100:8100"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./data/gguf_models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  embedding:
    image: vllm/vllm-openai:latest
    container_name: citadel-embedding
    restart: always
    ipc: host
    command:
      - --model
      - microsoft/harrier-oss-v1-0.6b
      - --served-model-name
      - harrier
      - --host
      - 0.0.0.0
      - --port
      - "8101"
      - --pooler-config
      - '{"task": "embed", "pooling_type": "LAST"}'
      - --gpu-memory-utilization
      - "0.11"
      - --max-num-seqs
      - "256"
      - --max-model-len
      - "3072"
      - --uvicorn-log-level
      - info
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8101:8101"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ${HOME}/.cache/citadel-embedding:/root/.cache/huggingface
      - embedding-vllm-cache:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: citadel-redis
    restart: always
    ports:
      - "${CITADEL_REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

  postgres:
    image: pgvector/pgvector:pg17
    container_name: citadel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${CITADEL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CITADEL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CITADEL_POSTGRES_DB:-citadel}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - tcp_keepalives_idle=30
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
    ports:
      - "${CITADEL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
  embedding-vllm-cache:
