[project]
name = "citadel"
version = "1.0.0"
description = "Citadel: personal search engine"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Masum Billal", email = "billalmasum93@gmail.com" }]

dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "cachetools>=7.1.4",
    "fastapi[standard]>=0.139.0",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.23.0",
    "lxml>=6.1.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "paddleocr>=3.7.0",
    "paddlepaddle-gpu>=3.3.1 ; sys_platform == 'linux'",
    "pebble>=5.2.0",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "polars>=1.42.1",
    "protobuf>=7.35.0",
    "pypdfium2>=5.11.0",
    "python-pptx>=1.0.2",
    "redis>=8.0.1",
    "sentence-transformers>=5.5.1",
    "sentencepiece>=0.2.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "torch>=2.13.0",
    "transformers>=5.13.1",
    "xgboost>=3.3.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "scikit-learn>=1.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

# cu130, to match pytorch-cu130: paddle also ships cu126/cu128/cu129 builds, and taking one of those would put a SECOND
# cuda runtime in the venv alongside torch's. verified on this box: cp313, sm_120 (compute capability 12.0), runtime 13.0
[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
paddlepaddle-gpu = [{ index = "paddle-cu130", marker = "sys_platform == 'linux'" }]
# torchvision = { index = "pytorch-cu130" }
# vllm = { index = "pytorch-cu130" }


[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    "node_modules",
    "backend/alembic",
    "scripts/migrations/**"
]

[tool.ruff.lint]
select = ["ALL"]
preview = true

ignore = [
    "D", # pydocstyle
    "CPY", # copyright
    "RUF029", # async doesn't use await
    "ARG001", # Unused function argument
    # "LOG", # own logger
    "FBT", # boolean type
    "ANN401", # Dynamic typed
    "SLF001", # private property
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
    "TRY300", # try except else
    "ERA001", # commented code
    "COM812", # no trailing comma
    "TD002", # author in TODO
    "ANN202", # private return type
    "PLR6301", # could be method or static
    "TRY003", # long message outside exception
    "EM101", # exception literal
    "INP001", # implicit namespace package
    # "T201", # print
]

# [tool.ruff.format]
# skip-magic-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"*tests/*.py" = [
    "S101",    # asserts allowed in tests...
    # "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
    # "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # "PLR2004", # Magic value used in comparison, ...
    # "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
]

[tool.bandit]
exclude_dirs = ['tests', '.venv', 'venv', 'alembic', 'scripts']

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py', 'tests/*', '.venv/*', 'venv/*']


[tool.mypy]
python_version = "3.13"
exclude = []
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"



[tool.uv]
cache-keys = [{ file = "uv.lock" }, { git = { commit = true } }]
concurrent-builds = 4
concurrent-downloads = 4
concurrent-installs = 4
# torch and paddle each hard-pin their own PATCH version of the same cuda 13 libraries (torch wants cudnn 9.19.0.56,
# paddle wants 9.13.0.50, and likewise for cublas/nccl/...), so out of the box they cannot co-resolve at all. these are
# the same shared objects both frameworks dlopen at runtime; cuda 13 is abi-stable within its major, so installing ONE
# version of each — the newer — is exactly what a system-wide cuda install does. relax the pins to a floor and let the
# resolver pick. verified after: paddle.utils.run_check() and torch.cuda both pass on sm_120.
override-dependencies = [
    "nvidia-cublas>=13.0.0",
    "nvidia-cuda-cupti>=13.0.0",
    "nvidia-cuda-nvrtc>=13.0.0",
    "nvidia-cuda-runtime>=13.0.0",
    "nvidia-cudnn-cu13>=9.13.0",
    "nvidia-cufft>=12.0.0",
    "nvidia-curand>=10.4.0",
    "nvidia-cusolver>=12.0.0",
    "nvidia-cusparse>=12.6.0",
    "nvidia-cusparselt-cu13>=0.8.0",
    "nvidia-nccl-cu13>=2.28.0",
    "nvidia-nvjitlink>=13.0.0",
    "nvidia-nvtx>=13.0.0",
]

[tool.uv.build-backend]
module-root = ""
