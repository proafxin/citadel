[project]
name = "citadel"
version = "2.1.1"
description = "Citadel: personal search engine"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Masum Billal", email = "billalmasum93@gmail.com" }]

dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "cachetools>=7.1.7",
    "fastapi[standard]>=0.141.1",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.29.0",
    "lxml>=6.1.2",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "polars>=1.44.1",
    "protobuf>=7.36.0",
    "pypdfium2>=5.13.0",
    "python-pptx>=1.0.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentencepiece>=0.2.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "tokenizers>=0.23.1",
    "xmltodict>=1.0.4",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.0.3",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true
# torchvision = { index = "pytorch-cu130" }
# vllm = { index = "pytorch-cu130" }


[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    "node_modules",
    "backend/alembic",
    "scripts/migrations/**"
]

[tool.ruff.lint]
select = ["ALL"]
preview = true

ignore = [
    "D", # pydocstyle
    "CPY", # copyright
    "RUF029", # async doesn't use await
    "ARG001", # Unused function argument
    # "LOG", # own logger
    "FBT", # boolean type
    "ANN401", # Dynamic typed
    "SLF001", # private property
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
    "TRY300", # try except else
    "ERA001", # commented code
    "COM812", # no trailing comma
    "TD002", # author in TODO
    "ANN202", # private return type
    "PLR6301", # could be method or static
    "TRY003", # long message outside exception
    "EM101", # exception literal
    "INP001", # implicit namespace package
    # "T201", # print
]

# [tool.ruff.format]
# skip-magic-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"*tests/*.py" = [
    "S101",    # asserts allowed in tests...
    # "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
    # "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # "PLR2004", # Magic value used in comparison, ...
    # "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
]

[tool.mypy]
python_version = "3.13"
exclude = []
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"



[tool.uv]
cache-keys = [{ file = "uv.lock" }, { git = { commit = true } }]
concurrent-builds = 4
concurrent-downloads = 4
concurrent-installs = 4

[tool.uv.build-backend]
module-root = ""
