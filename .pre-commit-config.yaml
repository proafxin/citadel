exclude: ^(\.git/|__pycache__/|\.venv/|venv/|build/|dist/|.*\.egg-info/|\.pytest_cache/|node_modules/|backend/alembic/|scripts/migrations/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
    - id: ruff-check
      args: ["--config=pyproject.toml", "--fix", '--unsafe-fixes']
    - id: ruff-format

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.171.0
    hooks:
    - id: semgrep
      types: [python]
      exclude: ^tests/
      args: ['--config', 'p/security-audit', '--error', '--skip-unknown-extensions', '--metrics=off']
